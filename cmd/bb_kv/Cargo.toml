[package]
name = "bb-kv"
version = "0.1.0"
edition = "2024"

[dependencies]
bazel-remote-apis = "0.27.0"
clap = { version = "4.6.6", features = ["derive"] }
hex = "0.4.3"
prost = "0.14.4"
sha2 = "0.11.0"
tempfile = "3.27.0"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "process", "io-util", "io-std"] }
tonic = "0.14.6"
